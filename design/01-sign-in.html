<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Sign In - Inventory Manager</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;family=Hanken+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#c3c0ff",
                        "outline-variant": "#c7c4d8",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#c8c5d3",
                        "on-tertiary-fixed-variant": "#41474f",
                        "tertiary-fixed-dim": "#c1c7d0",
                        "on-secondary-container": "#65636f",
                        "inverse-surface": "#2e3132",
                        "surface-container-highest": "#e1e3e4",
                        "inverse-on-surface": "#f0f1f2",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#464555",
                        "on-background": "#191c1d",
                        "on-secondary-fixed-variant": "#474551",
                        "secondary-fixed": "#e4e0ef",
                        "surface-bright": "#f8f9fa",
                        "primary-fixed": "#e2dfff",
                        "tertiary-container": "#6e747c",
                        "surface-container-high": "#e7e8e9",
                        "on-tertiary-container": "#fafaff",
                        "tertiary": "#555b63",
                        "surface-container-low": "#f3f4f5",
                        "surface-dim": "#d9dadb",
                        "outline": "#777587",
                        "secondary": "#5f5d69",
                        "secondary-container": "#e4e0ef",
                        "on-primary": "#ffffff",
                        "primary": "#493ee5",
                        "error": "#ba1a1a",
                        "background": "#f8f9fa",
                        "surface-container": "#edeeef",
                        "surface-tint": "#4c42e9",
                        "on-secondary-fixed": "#1b1a25",
                        "inverse-primary": "#c3c0ff",
                        "on-surface": "#191c1d",
                        "on-tertiary-fixed": "#161c23",
                        "on-error": "#ffffff",
                        "on-primary-fixed-variant": "#321ed2",
                        "on-primary-container": "#fefaff",
                        "tertiary-fixed": "#dde3ec",
                        "on-tertiary": "#ffffff",
                        "surface": "#f8f9fa",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#0f0069",
                        "primary-container": "#635bff",
                        "surface-variant": "#e1e3e4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "inner-padding-md": "1.25rem",
                        "gutter": "1rem",
                        "inner-padding-sm": "0.75rem",
                        "section-gap": "2.5rem",
                        "container-padding": "1.5rem",
                        "stack-gap": "1rem"
                    },
                    "fontFamily": {
                        "body-lg": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "headline-md": ["Manrope"],
                        "label-caps": ["Hanken Grotesk"],
                        "body-sm": ["Manrope"],
                        "label-sm": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}]

                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-focus-shadow {
            box-shadow: 0 8px 24px rgba(99, 91, 255, 0.08);
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(99, 91, 255, 0.15);
        }
        .active-press:active {
            transform: scale(0.98);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-lg min-h-screen flex flex-col items-center justify-center p-container-padding overflow-hidden">
<!-- Ambient Background Element -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-primary/10 blur-[150px]"></div>
</div>
<!-- Sign In Container -->
<main class="relative z-10 w-full max-w-[440px] flex flex-col gap-section-gap">
<!-- Header & Identity -->
<header class="text-center space-y-4">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary-container text-on-primary-container soft-focus-shadow mb-2">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Sign in</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[280px] mx-auto">Access your AWS-powered inventory management dashboard.</p>
</header>
<!-- Form Card -->
<section class="bg-surface-container-lowest rounded-xl p-inner-padding-md soft-focus-shadow border border-surface-variant/20">
<form class="flex flex-col gap-stack-gap">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1" for="email">EMAIL</label>
<div class="relative group">
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full h-12 pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-on-surface placeholder:text-outline/50 focus:border-primary transition-all duration-200" id="email" placeholder="hau@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">PASSWORD</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative group">
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full h-12 pl-12 pr-12 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-on-surface placeholder:text-outline/50 focus:border-primary transition-all duration-200" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="mt-4 w-full h-14 bg-primary text-on-primary font-headline-md text-headline-md rounded-xl active-press soft-focus-shadow transition-all duration-200 hover:brightness-110 flex items-center justify-center gap-2" type="submit">
                    Sign in
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Secondary Actions -->
<div class="mt-8 flex flex-col items-center gap-4">
<div class="flex items-center gap-4 w-full text-outline-variant">
<div class="h-[1px] bg-outline-variant flex-grow"></div>
<span class="font-label-caps text-label-caps">OR</span>
<div class="h-[1px] bg-outline-variant flex-grow"></div>
</div>
<button class="w-full h-12 bg-secondary-container text-on-secondary-container rounded-lg font-body-lg flex items-center justify-center gap-3 active-press transition-colors hover:bg-surface-variant">
<div class="w-5 h-5 bg-white rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-[#4285F4]" style="font-variation-settings: 'FILL' 1;">google</span>
</div>
                    Continue with SSO
                </button>
</div>
</section>
<!-- Footer Info -->
<footer class="text-center space-y-6">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account? <a class="text-primary font-bold hover:underline" href="#">Request access</a>
</p>
<div class="flex flex-wrap justify-center gap-x-6 gap-y-2 opacity-60">
<span class="font-label-sm text-label-sm flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">verified_user</span>
                    AWS Cognito Secured
                </span>
<span class="font-label-sm text-label-sm">v2.4.0</span>
</div>
</footer>
</main>
<!-- Visual Polish: Interactive Glass Gradient -->
<div class="fixed inset-0 pointer-events-none z-[-1] opacity-30 transition-opacity duration-1000" id="interactive-glow"></div>
<script>
        // Micro-interaction for the background based on mouse movement
        document.addEventListener('mousemove', (e) => {
            const glow = document.getElementById('interactive-glow');
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            glow.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(99, 91, 255, 0.15) 0%, transparent 40%)`;
        });

        // Simple form validation visual feedback
        const loginForm = document.querySelector('form');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...`;
            
            // Simulate AWS Lambda Latency
            setTimeout(() => {
                btn.classList.add('bg-success', 'bg-emerald-600');
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Welcome Back`;
                setTimeout(() => {
                    // Would typically redirect here
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.remove('bg-emerald-600');
                }, 1500);
            }, 1200);
        });
    </script>
</body></html>
