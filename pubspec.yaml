name: flutter_aws_serverless
description: Flutter mobile client for AWS Lambda + API Gateway + DynamoDB + Cognito.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  amplify_flutter: ^2.4.0
  amplify_auth_cognito: ^2.4.0
  amplify_api: ^2.4.0
  go_router: ^14.2.7
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  freezed: ^2.5.7

flutter:
  uses-material-design: true
